<div class="container-fluid">
  <h1 class="text-light text-center pt-5 pb-4">Admin Panel</h1>
  <div class="container">
    <ul class="tab mb-5">
      <li class="tab-item">
        <a
          class="tab-link active text-light p-3"
          [ngClass]="{ active: isActiveTab('product') }"
          (click)="setActiveTab('product')"
        >
          Product
        </a>
      </li>
      <li class="tab-item">
        <a
          class="tab-link text-light p-3"
          [ngClass]="{ active: isActiveTab('category') }"
          (click)="setActiveTab('category')"
        >
          Category
        </a>
      </li>
    </ul>
    <form id="product-form" class="pb-5" *ngIf="isActiveTab('product')">
      <div class="mb-3">
        <label for="title" class="form-label text-light">Title</label>
        <input id="title" type="text" class="form-control text-light" />
        <div class="text-danger">
          <p>Title is required.</p>
        </div>
      </div>
      <div class="mb-3 text-light">
        <label for="price" class="form-label text-light">Price</label>
        <input id="price" type="number" class="form-control text-light" />
        <div class="text-danger">
          <p>Price is required.</p>
        </div>
      </div>
      <div class="mb-3">
        <label for="category" class="from-label text-light">Category</label>
        <select id="category" class="form-select form-select-lg mb-3">
          <option value="1">Default</option>
          <option value="2">Admin</option>
        </select>
      </div>
      <div class="mb-3 text-light">
        <label for="description" class="form-label text-light">
          Description
        </label>
        <textarea
          id="description"
          type="description"
          class="form-control text-light"
        ></textarea>
        <div class="text-danger">
          <p>Description is required.</p>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Add New Product</button>
    </form>
    <form id="category-form" class="pb-5" *ngIf="isActiveTab('category')">
      <div class="mb-3">
        <label for="category-title" class="form-label text-light">Title</label>
        <input
          id="category-title"
          type="text"
          class="form-control text-light"
        />
        <div class="text-danger">
          <p>Title is required.</p>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Add New Category</button>
    </form>
  </div>
</div>

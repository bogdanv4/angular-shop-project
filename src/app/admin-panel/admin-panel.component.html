<div class="container-fluid">
  <h1 class="text-light text-center pt-5 pb-4">Admin Panel</h1>
  <div class="container">
    <ul class="tab mb-5">
      <li class="tab-item">
        <a
          class="tab-link active text-light p-3"
          [ngClass]="{ active: isActiveTab('product') }"
          (click)="setActiveTab('product')"
        >
          Product
        </a>
      </li>
      <li class="tab-item">
        <a
          class="tab-link text-light p-3"
          [ngClass]="{ active: isActiveTab('category') }"
          (click)="setActiveTab('category')"
        >
          Category
        </a>
      </li>
    </ul>
    <form
      [formGroup]="newProductForm"
      (ngSubmit)="addProduct()"
      id="product-form"
      class="pb-5"
      *ngIf="isActiveTab('product')"
    >
      <div class="mb-3">
        <label for="title" class="form-label text-light">Title</label>
        <input
          id="title"
          type="text"
          class="form-control text-light"
          formControlName="title"
        />
        <div
          *ngIf="
            newProductForm.get('title')?.invalid &&
            newProductForm.get('title')?.touched
          "
          class="text-danger"
        >
          <p *ngIf="newProductForm.get('title')?.errors?.['required']">
            Title is required.
          </p>
        </div>
      </div>
      <div class="mb-3 text-light">
        <label for="price" class="form-label text-light">Price</label>
        <input
          id="price"
          type="number"
          class="form-control text-light"
          formControlName="price"
        />
        <div
          *ngIf="
            newProductForm.get('price')?.invalid &&
            newProductForm.get('price')?.touched
          "
          class="text-danger"
        >
          <p *ngIf="newProductForm.get('price')?.errors?.['required']">
            Price is required.
          </p>
        </div>
      </div>
      <div class="mb-3">
        <label for="category" class="from-label text-light">Category</label>
        <select
          id="category"
          class="form-select form-select-lg mb-3"
          formControlName="category"
        >
          <option value="0" disabled>Please select category</option>
          <option value="1">Category 1</option>
          <option value="2">Category 2</option>
          <option value="3">Category 3</option>
        </select>
      </div>
      <div class="mb-3 text-light">
        <label for="description" class="form-label text-light">
          Description
        </label>
        <textarea
          id="description"
          type="description"
          class="form-control text-light"
          formControlName="description"
        ></textarea>
        <div
          *ngIf="
            newProductForm.get('description')?.invalid &&
            newProductForm.get('description')?.touched
          "
          class="text-danger"
        >
          <p *ngIf="newProductForm.get('description')?.errors?.['required']">
            Description is required.
          </p>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="newProductForm.invalid"
      >
        Add New Product
      </button>
    </form>
    <form
      [formGroup]="newCategoryForm"
      (ngSubmit)="addCategory()"
      id="category-form"
      class="pb-5"
      *ngIf="isActiveTab('category')"
    >
      <div class="mb-3">
        <label for="category-title" class="form-label text-light">Title</label>
        <input
          id="category-title"
          type="text"
          class="form-control text-light"
          formControlName="title"
        />
        <div
          *ngIf="
            newCategoryForm.get('title')?.invalid &&
            newCategoryForm.get('title')?.touched
          "
          class="text-danger"
        >
          <p *ngIf="newCategoryForm.get('title')?.errors?.['required']">
            Title is required.
          </p>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="newCategoryForm.invalid"
      >
        Add New Category
      </button>
    </form>
  </div>
</div>
